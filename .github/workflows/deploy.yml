name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Check, build and deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        env:
          VITE_ADSENSE_CLIENT: ${{ vars.VITE_ADSENSE_CLIENT }}
          VITE_ADSENSE_LANDING_SLOT: ${{ vars.VITE_ADSENSE_LANDING_SLOT }}
        run: npm run build

      - name: Check Cloudflare deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::GitHub Secret CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "::error::GitHub Secret CLOUDFLARE_ACCOUNT_ID is not configured."
            exit 1
          }

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          wranglerVersion: '4.118.0'

      - name: Smoke test health endpoint
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            response="$(curl --fail --silent --show-error --max-time 20 https://maananaja.final0505.workers.dev/healthz || true)"
            if echo "$response" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' && \
              echo "$response" | grep -Eq '"service"[[:space:]]*:[[:space:]]*"maananaja"'; then
              exit 0
            fi
            sleep 5
          done
          echo "Health endpoint did not return the expected JSON response."
          exit 1
