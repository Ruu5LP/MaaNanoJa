<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans', 'Yu Gothic', sans-serif">
  <defs>
    <style>
      .card { fill: #17201b; stroke: #2c3a31; stroke-width: 1; }
      .track { fill: #1f2b24; }
      .ink { fill: #e8f0ea; }
      .ink2 { fill: #a9b8af; }
      .ink3 { fill: #7e8f85; }
      .accent { fill: #3ecf8e; }
      .danger { fill: #e0555f; }
      .rank1 { fill: #4a90d9; }
      .rank2 { fill: #8ec6e6; }
      .rank3 { fill: #f0a58a; }
      .rank4 { fill: #e0555f; }
      .num { font-variant-numeric: tabular-nums; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#0f1512"/>

  <!-- header -->
  <text x="40" y="55" class="ink" font-size="30" font-weight="700">麻雀トラッカー</text>
  <text x="260" y="55" class="ink3" font-size="20">AiRuu Mahjong</text>
  <rect x="1390" y="28" width="170" height="34" rx="8" fill="#27352c"/>
  <text x="1475" y="50" text-anchor="middle" fill="#e9b949" font-size="16">⏳ 接続確認中…</text>

  <!-- period toggle -->
  <rect x="40" y="88" width="70" height="40" rx="8" fill="#27352c"/>
  <text x="75" y="113" text-anchor="middle" class="ink2" font-size="16">今日</text>
  <rect x="118" y="88" width="100" height="40" rx="8" fill="#3ecf8e"/>
  <text x="168" y="113" text-anchor="middle" fill="#072016" font-size="16" font-weight="700">全期間</text>
  <rect x="1310" y="88" width="250" height="40" rx="8" fill="#27352c"/>
  <text x="1435" y="113" text-anchor="middle" class="ink2" font-size="15">合計スコアだけを表示 ↗</text>

  <!-- top-left: total score -->
  <rect x="40" y="150" width="760" height="500" rx="12" class="card"/>
  <text x="72" y="196" class="ink" font-size="22" font-weight="700">合計スコア</text>
  <g font-size="17">
    <text x="72" y="240" class="ink2">たろう</text>
    <rect x="180" y="220" width="530" height="26" rx="4" class="track"/>
    <rect x="445" y="220" width="265" height="26" rx="4" class="accent"/>
    <text x="720" y="240" class="accent num" font-weight="700">+103.1</text>

    <text x="72" y="282" class="ink2">はなこ</text>
    <rect x="180" y="262" width="530" height="26" rx="4" class="track"/>
    <rect x="445" y="262" width="41" height="26" rx="4" class="accent"/>
    <text x="720" y="282" class="accent num" font-weight="700">+15.9</text>

    <text x="72" y="324" class="ink2">じろう</text>
    <rect x="180" y="304" width="530" height="26" rx="4" class="track"/>
    <rect x="290" y="304" width="155" height="26" rx="4" class="danger"/>
    <text x="720" y="324" class="danger num" font-weight="700">-58.0</text>

    <text x="72" y="366" class="ink2">ルウ</text>
    <rect x="180" y="346" width="530" height="26" rx="4" class="track"/>
    <rect x="282" y="346" width="163" height="26" rx="4" class="danger"/>
    <text x="720" y="366" class="danger num" font-weight="700">-61.0</text>
  </g>

  <!-- bottom-left: rank/score table -->
  <rect x="40" y="666" width="760" height="192" rx="12" class="card"/>
  <text x="72" y="706" class="ink" font-size="20" font-weight="700">順位・スコア</text>
  <g font-size="14" class="ink3">
    <text x="72" y="736">プレイヤー</text>
    <text x="230" y="736">戦</text>
    <text x="300" y="736">合計</text>
    <text x="390" y="736">平均</text>
    <text x="470" y="736">平均順位</text>
    <text x="580" y="736">トップ率</text>
    <text x="680" y="736">ラス率</text>
  </g>
  <g font-size="16">
    <text x="72" y="776" class="ink">たろう</text>
    <text x="230" y="776" class="ink2 num">2</text>
    <text x="300" y="776" class="accent num" font-weight="700">+103.1</text>
    <text x="390" y="776" class="accent num">+51.5</text>
    <text x="470" y="776" class="ink2 num">1.00</text>
    <text x="580" y="776" class="ink2 num">100.0%</text>
    <text x="680" y="776" class="ink2 num">0.0%</text>
  </g>

  <!-- right: rank distribution -->
  <rect x="820" y="150" width="740" height="708" rx="12" class="card"/>
  <text x="852" y="196" class="ink" font-size="22" font-weight="700">着順分布</text>

  <g font-size="16">
    <text x="852" y="234" class="ink" font-weight="700">たろう</text>
    <text x="1500" y="234" text-anchor="end" class="ink3" font-size="14">平均1.00位・2戦</text>
    <rect x="852" y="246" width="640" height="30" rx="6" class="rank1"/>
    <text x="1172" y="266" text-anchor="middle" fill="#072016" font-weight="700">100%</text>
    <g font-size="13">
      <rect x="852" y="286" width="160" height="30" rx="6" fill="#1f2b24"/>
      <text x="864" y="306" class="rank1">■</text><text x="884" y="306" class="ink2">1位</text><text x="955" y="306" class="ink" font-weight="700">2</text><text x="978" y="306" class="ink3">100%</text>
      <rect x="1020" y="286" width="150" height="30" rx="6" fill="#1f2b24"/>
      <text x="1032" y="306" class="rank2">■</text><text x="1052" y="306" class="ink2">2位</text><text x="1123" y="306" class="ink" font-weight="700">0</text><text x="1146" y="306" class="ink3">0%</text>
      <rect x="1178" y="286" width="150" height="30" rx="6" fill="#1f2b24"/>
      <text x="1190" y="306" class="rank3">■</text><text x="1210" y="306" class="ink2">3位</text><text x="1281" y="306" class="ink" font-weight="700">0</text><text x="1304" y="306" class="ink3">0%</text>
      <rect x="1336" y="286" width="150" height="30" rx="6" fill="#1f2b24"/>
      <text x="1348" y="306" class="rank4">■</text><text x="1368" y="306" class="ink2">4位</text><text x="1439" y="306" class="ink" font-weight="700">0</text><text x="1462" y="306" class="ink3">0%</text>
    </g>

    <text x="852" y="360" class="ink" font-weight="700">はなこ</text>
    <text x="1500" y="360" text-anchor="end" class="ink3" font-size="14">平均2.00位・2戦</text>
    <rect x="852" y="372" width="640" height="30" rx="6" class="rank2"/>
    <text x="1172" y="392" text-anchor="middle" fill="#072016" font-weight="700">100%</text>

    <text x="852" y="452" class="ink" font-weight="700">じろう</text>
    <text x="1500" y="452" text-anchor="end" class="ink3" font-size="14">平均3.50位・2戦</text>
    <rect x="852" y="464" width="320" height="30" rx="6" class="rank3"/>
    <rect x="1172" y="464" width="320" height="30" rx="6" class="rank4"/>
    <text x="1012" y="484" text-anchor="middle" fill="#072016" font-weight="700">50%</text>
    <text x="1332" y="484" text-anchor="middle" fill="#072016" font-weight="700">50%</text>

    <text x="852" y="544" class="ink" font-weight="700">ルウ</text>
    <text x="1500" y="544" text-anchor="end" class="ink3" font-size="14">平均3.50位・2戦</text>
    <rect x="852" y="556" width="320" height="30" rx="6" class="rank3"/>
    <rect x="1172" y="556" width="320" height="30" rx="6" class="rank4"/>
    <text x="1012" y="576" text-anchor="middle" fill="#072016" font-weight="700">50%</text>
    <text x="1332" y="576" text-anchor="middle" fill="#072016" font-weight="700">50%</text>
  </g>

  <!-- bottom nav -->
  <rect x="0" y="830" width="1600" height="70" fill="#17201b" stroke="#2c3a31"/>
  <g font-size="15" text-anchor="middle">
    <text x="200" y="858" class="ink3">記録</text>
    <text x="600" y="858" class="accent">成績</text>
    <text x="1000" y="858" class="ink3">履歴</text>
    <text x="1400" y="858" class="ink3">設定</text>
  </g>
</svg>
